# Name of the Github Actions workflow
name: MAUI CI/CD

# Define the events that trigger the Github Actions workflow
on:
  push:
    branches:
      - master # Only trigger the workflow on the master branch
    paths-ignore:
      - '**/*.md' # Ignore markdown files
      - '**/*.git*' # Ignore git files
  pull_request:
    branches:
      - master # Only trigger the workflow on the master branch
  workflow_dispatch:

# Define the environment variables to be used in the Github Actions workflow
env:
  DOTNET_NOLOGO: true
  DOTNET_SKIP_FIRST_TIME_EXPERIENCE: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  # Build job to build the MAUI app for Android
  build-maui-android:
    name: Build MAUI for Android
    runs-on: windows-latest
    strategy:
      matrix:
        dotnet-version: [8.0.x]
        target-framework: [net8.0-android]
    steps:
      - uses: actions/checkout@v3
      
      # Setup Key Store for Android signing
      - name: Setup Key Store
        run: |
          echo "${{ secrets.JOHNKEY }}" > myapp.keystore.asc
          gpg -d --passphrase "${{ secrets.KEYPASSWORD }}" --batch myapp.keystore.asc > myapp.keystore
      
      # Cache NuGet packages for faster builds
      - name: Cache .NET packages
        uses: actions/cache@v4.3.0
        with:
          path: '~/.nuget/packages'
          key: ${{ runner.os }}-dotnet-${{ matrix.dotnet-version }}-packages-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-${{ matrix.dotnet-version }}-packages-
            ${{ runner.os }}-dotnet-${{ matrix.dotnet-version }}-
            ${{ runner.os }}-dotnet-
      
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      
      # Install the MAUI workload
      - name: Install MAUI workload
        run: dotnet workload install maui --ignore-failed-sources
      
      - name: Build Android App
        run: dotnet build L00177804_Project/L00177804_Project.csproj -c Release -f ${{ matrix.target-framework }} /p:AndroidSigningKeyStore=myapp.keystore /p:AndroidSigningKeyAlias=ghactionskey /p:AndroidSigningKeyPass="${{ secrets.KEYPASSWORD }}" /p:AndroidSigningStorePass="${{ secrets.KEYSTORE_ALIAS }}"
      
      - name: Upload Android artifacts
        if: success()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: android-artifacts
          path: |
            ./**/*.aab
            ./**/*.apk
          
  # Build job to build the MAUI app for iOS
  build-maui-ios:
    name: Build MAUI for iOS
    runs-on: macos-latest  # iOS builds require macOS
    strategy:
      matrix:
        dotnet-version: [8.0.x]
        target-framework: [net8.0-ios]
    steps:
      - uses: actions/checkout@v3
      
      # Cache NuGet packages for faster builds
      - name: Cache .NET packages
        uses: actions/cache@v4.3.0
        with:
          path: '~/.nuget/packages'
          key: ${{ runner.os }}-dotnet-${{ matrix.dotnet-version }}-packages-${{ hashFiles('**/*.csproj') }}
          restore-keys: |
            ${{ runner.os }}-dotnet-${{ matrix.dotnet-version }}-packages-
            ${{ runner.os }}-dotnet-${{ matrix.dotnet-version }}-
            ${{ runner.os }}-dotnet-
      
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: ${{ matrix.dotnet-version }}
      
      # Install the MAUI workload
      - name: Install MAUI workload
        run: dotnet workload install maui --ignore-failed-sources
      
      - name: Build iOS App
        run: dotnet build L00177804_Project/L00177804_Project.csproj -c Release -f ${{ matrix.target-framework }}
      
      - name: Upload iOS artifacts
        if: success()
        uses: actions/upload-artifact@v4.6.2
        with:
          name: ios-artifacts
          path: L00177804_Project/bin/Release/net8.0-ios/
      
  # Test job to run the unit tests
  test:
    needs: [build-maui-android]
    runs-on: windows-latest
    permissions:
      contents: read
      pull-requests: write
      checks: write
      statuses: write
    steps:
      - uses: actions/checkout@v3
      
      - name: Cache NuGet packages
        uses: actions/cache@v4.3.0
        with:
          path: ~/.nuget/packages
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/xUnitTests.csproj') }}
          restore-keys: |
            ${{ runner.os }}-nuget-
      
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x
      
      - name: Restore NuGet packages
        run: dotnet restore
        working-directory: ./xUnitTests
      
      - name: Build solution
        run: dotnet build --configuration Release --no-restore
        working-directory: ./xUnitTests
      
      - name: Run tests
        run: dotnet test --logger:xunit
      
      - name: Publish Test Results
        uses: EnricoMi/publish-unit-test-result-action/composite@v2
        if: always()
        with:
          files: |
            **/TestResults.xml

  # CodeQL Analysis
  analyze:
    needs: [build-maui-android, build-maui-ios]
    name: CodeQL Analysis
    runs-on: windows-latest
    strategy:
      fail-fast: false
      matrix:
        language: ['csharp']
    steps:
      - uses: actions/checkout@v3
      
      - name: Cache NuGet packages
        uses: actions/cache@v4.3.0
        with:
          path: |
            ~/.nuget/packages
            ./bin
          key: ${{ runner.os }}-nuget-${{ hashFiles('**/project.assets.json') }}-${{ matrix.language }}
      
      - uses: actions/setup-dotnet@v3
        with:
          dotnet-version: 8.0.x
      
      - name: Restore NuGet packages
        run: dotnet restore
      
      - name: Initialize CodeQL
        uses: github/codeql-action/init@v2
        with:
          languages: ${{ matrix.language }}
          config-file: ./.github/workflows/dotnet/codeql-config.yml
      
      - name: Build project
        run: dotnet build 
      
      - name: Perform CodeQL Analysis
        uses: github/codeql-action/analyze@v2

  # Deploy job to deploy the MAUI app         
  deploy:
    needs: test
    if: ${{ needs.test.result == 'success' }}
    name: Deploy MAUI App
    runs-on: windows-latest
    steps:
      - name: Deploy to Playstore
        run: echo "Deploying to Playstore in progress"
